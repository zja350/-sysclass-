<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>系统班 · 打卡与PK工作台（v9 复刻版）</title>
<style>
  :root{
    --bg:#FFF9FB; --card:#ffffff; --ink:#5b5570; --sub:#a59cb8;
    --line:#f4e9f1; --brand:#C9B8FF; --brand-soft:#f3eeff;
    --pink:#FFB7C5; --pink-soft:#ffe9ef;
    --green:#B5EAD7; --green-soft:#e8f8f1;
    --yellow:#FFE5A0; --yellow-soft:#fff6e0;
    --sky:#A0D8FF; --sky-soft:#eaf6ff;
    --peach:#FFD3B6; --peach-soft:#fff0e8;
    --ok:#B5EAD7; --ok-soft:#e8f8f1;
    --warn:#FFE5A0; --warn-soft:#fff6e0;
    --pending:#E7E0F0; --pending-soft:#f6f1fb;
    --danger:#FFB7C5; --danger-soft:#ffe9ef;
    --radius:20px; --radius-sm:14px; --shadow:0 8px 24px rgba(201,184,255,.16);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:"PingFang SC","Microsoft YaHei",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55;letter-spacing:.2px}
  #root{min-height:100vh}
  .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
  .card h2{font-size:16px;margin:0 0 4px;display:flex;align-items:center;gap:8px}
  .card .desc{color:var(--sub);font-size:12.5px;margin:0 0 14px}
  .sec-title{font-size:13.5px;font-weight:800;color:#7a5fd0;margin:16px 0 6px}
  .callout{background:var(--brand-soft);color:#7a5fd0;border-radius:14px;padding:10px 12px;
    font-size:13px;margin:0 0 12px;line-height:1.5;font-weight:700}
  .note{background:var(--yellow-soft);color:#8a6d00;border:1px solid #ffe9b0;border-radius:14px;
    padding:10px 12px;font-size:12.5px;margin:12px 0;line-height:1.5}
  .empty{color:var(--sub);font-size:13px;text-align:center;padding:18px;background:var(--pending-soft);border-radius:14px}
  .pill{font-size:11px;background:var(--pending-soft);color:var(--sub);padding:3px 9px;border-radius:999px;white-space:nowrap}
  .date-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
  input[type=date],input[type=text],input[type=number],select{border:2px solid var(--line);border-radius:var(--radius-sm);padding:9px 11px;font-size:14px;color:var(--ink);background:#fff;font-family:inherit}
  textarea{width:100%;border:2px solid var(--line);border-radius:var(--radius-sm);padding:11px 12px;
    font-size:14px;font-family:inherit;color:var(--ink);background:#fff;resize:vertical}
  textarea:focus,input:focus,select:focus{outline:none;border-color:var(--brand)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:999px;
    background:linear-gradient(135deg,#C9B8FF,#FFB7C5);color:#fff;font-weight:700;font-size:15px;padding:12px 18px;cursor:pointer;width:100%;margin-top:12px;transition:.18s;box-shadow:0 6px 16px rgba(201,184,255,.3)}
  .btn:hover{transform:translateY(-2px);box-shadow:0 10px 22px rgba(201,184,255,.4)}
  .btn:active{transform:translateY(0)}
  .btn.ghost{background:var(--brand-soft);color:#7a5fd0;box-shadow:none}
  .btn.danger{background:#fff;color:#e06a86;border:2px solid var(--pink)}
  .btn.sm{width:auto;padding:8px 16px;font-size:13px;margin-top:0}
  .btn-exit{border:0;border-radius:999px;padding:8px 16px;font-size:13px;font-weight:700;cursor:pointer;background:rgba(255,255,255,.35);color:#fff;flex:0 0 auto;transition:.15s}
  .btn-exit:active{background:rgba(255,255,255,.55)}
  .pk-item{border:2px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px;background:#fff}
  .pk-item .hd{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);margin-bottom:6px}
  .pk-item .ct{font-size:14px;white-space:pre-wrap;word-break:break-word}
  .fb-box{margin-top:10px;background:var(--brand-soft);border-radius:12px;padding:10px;font-size:13px}
  .fb-box .fl{color:#7a5fd0;font-weight:700;font-size:12px;margin-bottom:4px}
  .badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px}
  .badge.pending{background:var(--yellow-soft);color:#8a6d00}
  .badge.done{background:var(--green-soft);color:#3fae84}
  .badge.team{background:var(--brand-soft);color:#7a5fd0}
  .badge.ind{background:var(--pink-soft);color:#d06a86}
  .badge.win{background:var(--green-soft);color:#3fae84}
  .badge.lose{background:var(--pink-soft);color:#d06a86}
  .badge.draw{background:var(--yellow-soft);color:#8a6d00}
  .filter-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
  .filter-row.type{margin-top:4px}
  .legend{display:flex;gap:14px;font-size:11.5px;color:var(--sub);margin:2px 0 10px;flex-wrap:wrap}
  .legend span{display:flex;align-items:center;gap:5px}
  .legend i{width:12px;height:12px;border-radius:50%;display:inline-block}
  .result-row{display:flex;gap:8px;margin:8px 0}
  .result-row button{flex:1;border:2px solid var(--line);background:#fff;border-radius:14px;padding:9px;font-weight:700;font-size:14px;cursor:pointer;color:var(--sub)}
  .result-row button.sel-w{background:var(--green-soft);border-color:var(--green);color:#3fae84}
  .result-row button.sel-l{background:var(--pink-soft);border-color:var(--pink);color:#d06a86}
  .result-row button.sel-d{background:var(--yellow-soft);border-color:var(--yellow);color:#8a6d00}

  /* ---------- 登录页 ---------- */
  .login-wrap{max-width:760px;margin:0 auto;padding:30px 16px 50px}
  .login-hero{text-align:center;margin-bottom:24px}
  .login-hero .lh-logo{font-size:54px}
  .login-hero h1{font-size:22px;margin:8px 0 6px;font-weight:800;letter-spacing:.5px}
  .login-hero p{color:var(--sub);font-size:13px;margin:0}
  .login-cards{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .login-card{border:2px solid var(--line);border-radius:var(--radius);padding:20px;background:#fff;box-shadow:var(--shadow);text-align:center}
  .login-card .lc-ic{font-size:44px;margin-bottom:6px}
  .login-card h3{margin:0 0 4px;font-size:18px}
  .login-card p{color:var(--sub);font-size:12.5px;margin:0 0 14px}
  .login-card input{width:100%;margin-bottom:10px}
  .acct-list{font-size:12px;color:var(--sub);background:var(--pending-soft);border-radius:12px;padding:8px 10px;margin-top:10px;line-height:1.6;text-align:left}
  .login-note{text-align:center;color:#b39ddb;font-size:18px;margin-top:22px;line-height:1.7;font-family:"STXingkai","华文行楷","Xingkai SC","STKaiti","华文楷体","KaiTi","楷体",cursive;letter-spacing:1.5px;font-weight:600;text-shadow:0 1px 2px rgba(179,157,219,.18)}

  /* ---------- 学生端 ---------- */
  .stu-layout{max-width:760px;margin:0 auto;padding:0 14px 90px;min-height:100vh}
  .stu-banner{background:linear-gradient(135deg,#C9B8FF,#FFB7C5);color:#fff;border-radius:0 0 28px 28px;padding:22px 18px 18px;box-shadow:0 8px 22px rgba(201,184,255,.35);margin:0 -14px 16px}
  .sb-top{display:flex;align-items:center;gap:14px}
  .sb-avatar{width:62px;height:62px;border-radius:22px;background:rgba(255,255,255,.32);display:flex;align-items:center;justify-content:center;font-size:36px;flex:0 0 auto;box-shadow:0 4px 12px rgba(0,0,0,.08)}
  .sb-name{font-size:20px;font-weight:800}
  .sb-sub{font-size:12.5px;opacity:.95;margin-top:3px}
  .stu-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
  .stu-stat{background:rgba(255,255,255,.3);border-radius:16px;padding:10px 6px;text-align:center;backdrop-filter:blur(2px)}
  .stu-stat b{display:block;font-size:18px;font-weight:800}
  .stu-stat span{font-size:11px;opacity:.95}
  .checkin-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .checkin-cell{border:2px solid var(--line);border-radius:18px;padding:16px 12px;text-align:center;cursor:pointer;background:#fff;transition:.18s}
  .checkin-cell:active{transform:scale(.98)}
  .checkin-cell.done{border-color:var(--green);background:var(--green-soft)}
  .cc-ic{font-size:30px}
  .cc-lb{font-weight:700;font-size:14px;margin:6px 0 4px}
  .cc-st{font-size:11px;color:var(--sub)}
  .checkin-cell.done .cc-st{color:#3fae84}
  .day-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .day-cell{border:2px solid var(--line);border-radius:16px;padding:14px 8px;text-align:center;cursor:pointer;background:#fff;transition:.18s;display:flex;flex-direction:column;align-items:center;gap:4px}
  .day-cell:active{transform:scale(.97)}
  .day-cell.done{border-color:var(--green);background:var(--green-soft)}
  .dc-ic{font-size:24px}
  .dc-lb{font-weight:700;font-size:14px}
  .dc-st{font-size:13px;font-weight:800;color:var(--pending)}
  .day-cell.done .dc-st{color:#3fae84}
  .tip-card{display:flex;align-items:center;gap:12px;background:var(--yellow-soft);border:1px solid #ffe9b0}
  .tip-ic{font-size:30px}
  .tip-card div:last-child{font-size:13px;color:#8a6d00}
  .mate-row{display:flex;align-items:center;gap:10px;padding:12px 4px;border-bottom:2px solid var(--line)}
  .mate-row:last-child{border-bottom:0}
  .avatar{width:42px;height:42px;border-radius:50%;background:var(--brand-soft);color:#7a5fd0;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;flex:0 0 auto}
  .mate-row .nm{flex:1;font-weight:700}
  .mate-row .nm small{display:block;color:var(--sub);font-weight:400;font-size:11.5px}
  .pos-badge{font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--pending-soft);color:var(--sub);white-space:nowrap}
  .pos-badge.on{background:var(--brand-soft);color:#7a5fd0}
  .post-row{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:2px solid var(--line)}
  .post-row:last-child{border-bottom:0}
  .post-row .pos{font-weight:800;color:#7a5fd0;min-width:84px}
  .post-row .holders{color:var(--ink);font-size:14px}
  .guide-card{background:var(--brand-soft);border-radius:16px;padding:14px;margin-bottom:12px}
  .guide-hi{font-weight:800;color:#7a5fd0;font-size:15px;margin-bottom:4px}
  .guide-sub{font-size:12.5px;color:#7a5fd0;opacity:.9;line-height:1.5}
  .word-count{font-size:12px;color:#7a5fd0;margin-top:6px;text-align:right}
  .word-count .muted{color:var(--sub);font-size:11px}
  .stu-tabbar{position:fixed;bottom:0;left:0;right:0;max-width:760px;margin:0 auto;display:flex;background:#fff;
    box-shadow:0 -6px 20px rgba(201,184,255,.18);border-radius:22px 22px 0 0;padding:8px 6px 10px;z-index:30}
  .tab-item{flex:1;text-align:center;cursor:pointer;padding:4px 2px;border-radius:14px;color:var(--sub);transition:.15s}
  .tab-item.on{background:var(--brand-soft);color:#7a5fd0}
  .ti-ic{font-size:22px;display:block}
  .ti-lb{font-size:11px;font-weight:700;display:block;margin-top:2px}
  .rank-row{display:flex;align-items:center;gap:12px;padding:12px;margin-bottom:10px;border-radius:18px;background:#fff;border:2px solid var(--line)}
  .rank-row.top1{border-color:var(--yellow);background:linear-gradient(135deg,#fff6e0,#ffe9ef)}
  .rank-row.top2{border-color:var(--pink);background:linear-gradient(135deg,#ffe9ef,#f3eeff)}
  .rank-row.top3{border-color:var(--brand);background:linear-gradient(135deg,#f3eeff,#e8f8f1)}
  .rank-medal{font-size:26px;width:34px;text-align:center;flex:0 0 auto}
  .rank-row .nm{flex:1;font-weight:800}
  .rank-row .nm small{display:block;color:var(--sub);font-weight:400;font-size:11.5px}
  .rank-score{text-align:right;font-weight:800;color:#7a5fd0}
  .rank-score small{display:block;color:var(--sub);font-weight:400;font-size:11px}

  /* ---------- 管理员端 ---------- */
  .admin-layout{display:flex;min-height:100vh}
  .sidebar{width:220px;flex:0 0 auto;background:#fff;border-right:2px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;overflow-y:auto}
  .sb-logo{font-size:17px;font-weight:800;color:#7a5fd0;text-align:center;line-height:1.3;margin-bottom:4px}
  .sb-logo small{font-size:11px;color:var(--sub);font-weight:600}
  .sb-nav{display:flex;flex-direction:column;gap:4px;margin-top:14px}
  .sb-item{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:14px;cursor:pointer;color:var(--ink);font-weight:700;font-size:14px;transition:.15s}
  .sb-item:hover{background:var(--brand-soft)}
  .sb-item.on{background:linear-gradient(135deg,#C9B8FF,#FFB7C5);color:#fff;box-shadow:0 4px 12px rgba(201,184,255,.3)}
  .sb-ic{font-size:18px}
  .sb-foot{margin-top:14px;text-align:center;font-size:11px;color:var(--sub)}
  .admin-main{flex:1;min-width:0;display:flex;flex-direction:column}
  .admin-topbar{background:linear-gradient(135deg,#C9B8FF,#FFB7C5);color:#fff;padding:18px 22px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;box-shadow:0 6px 18px rgba(201,184,255,.3)}
  .tg-hi{font-size:20px;font-weight:800}
  .tg-sub{font-size:12.5px;opacity:.95;margin-top:3px}
  .top-stats{display:flex;gap:10px}
  .top-stat{background:rgba(255,255,255,.3);border-radius:16px;padding:10px 16px;text-align:center;min-width:74px}
  .top-stat b{display:block;font-size:22px;font-weight:800}
  .top-stat.warn b{color:#fff}
  .top-stat span{font-size:11px;opacity:.95}
  .admin-content{max-width:980px;width:100%;margin:0 auto;padding:18px 18px 40px}
  .core-card .core-item{display:flex;align-items:center;gap:12px;padding:12px;border:2px solid var(--line);border-radius:16px;margin-bottom:10px;cursor:pointer;background:#fff;transition:.15s}
  .core-card .core-item.done{border-color:var(--green);background:var(--green-soft)}
  .core-box{width:26px;height:26px;border-radius:9px;border:2px solid var(--brand);display:flex;align-items:center;justify-content:center;color:#7a5fd0;font-weight:800;flex:0 0 auto}
  .core-item.done .core-box{background:var(--green);border-color:var(--green);color:#fff}
  .core-text{font-size:14px;font-weight:600}
  .core-item.done .core-text{color:#3fae84;text-decoration:line-through;opacity:.8}
  .stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
  .stat{background:var(--card);border-radius:18px;padding:14px;box-shadow:var(--shadow)}
  .stat .v{font-size:24px;font-weight:800;color:#7a5fd0;line-height:1.1}
  .stat .v.ok{color:#3fae84} .stat .v.warn{color:#d99a00}
  .stat .k{font-size:12.5px;color:var(--sub);margin-top:4px}
  .stu-row{display:flex;align-items:center;gap:10px;padding:12px 4px;border-bottom:2px solid var(--line)}
  .stu-row:last-child{border-bottom:0}
  .stu-row .nm{flex:1;font-weight:700}
  .stu-row .nm small{display:block;color:var(--sub);font-weight:400;font-size:11.5px}
  .dots{display:flex;gap:5px;align-items:center}
  .dot{width:18px;height:18px;border-radius:50%;background:var(--pending-soft);display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;font-weight:800}
  .dot.on{background:var(--green)} .dot.off{background:var(--pending)}
  .pk-review{border:2px solid var(--line);border-radius:16px;padding:13px;margin-bottom:12px;background:#fff}
  .pk-review .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px;flex-wrap:wrap}
  .mgmt-row{display:flex;align-items:center;gap:8px;padding:8px 4px;border-bottom:2px solid var(--line);flex-wrap:wrap}
  .mgmt-row:last-child{border-bottom:0}
  .mgmt-row .id{font-weight:800;font-family:monospace;color:#7a5fd0}
  .mgmt-row .nm{flex:1;min-width:80px}
  .mgmt-row .nm small{display:block;color:var(--sub);font-weight:400;font-size:11px}
  .team-group{margin-bottom:14px}
  .team-group .cg-title{font-size:13px;font-weight:800;color:#7a5fd0;margin:6px 0 4px;display:flex;justify-content:space-between}
  .talent-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
  .talent-card{background:#fff;border:2px solid var(--line);border-radius:20px;padding:14px;box-shadow:var(--shadow)}
  .tc-head{display:flex;align-items:center;gap:10px}
  .tc-avatar{width:48px;height:48px;border-radius:16px;background:var(--brand-soft);display:flex;align-items:center;justify-content:center;font-size:26px;flex:0 0 auto}
  .tc-name{font-weight:800;font-size:16px}
  .tc-role{font-size:11.5px;color:var(--sub)}
  .tc-type{margin-left:auto;font-size:11px;font-weight:800;padding:5px 10px;border-radius:999px;background:var(--pending-soft);color:var(--sub);white-space:nowrap}
  .tc-type.t-top{background:var(--yellow-soft);color:#b07a00}
  .tc-type.t-mid{background:var(--green-soft);color:#3fae84}
  .tc-type.t-low{background:var(--pink-soft);color:#d06a86}
  .tc-tags{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
  .tc-tag{font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px;background:var(--brand-soft);color:#7a5fd0}
  .tc-tag.hi{background:var(--yellow-soft);color:#b07a00}
  .tc-foot{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .pick-chk{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;white-space:nowrap}
  .acct-list{font-size:12px;color:var(--sub);background:var(--pending-soft);border-radius:12px;padding:8px 10px;margin-top:6px;line-height:1.6}
  @media(max-width:860px){
    .admin-layout{flex-direction:column}
    .sidebar{width:100%;height:auto;position:static;border-right:0;border-bottom:2px solid var(--line);padding:12px}
    .sb-nav{flex-direction:row;overflow-x:auto;margin-top:8px}
    .sb-item{white-space:nowrap}
    .sb-logo{text-align:left}
    .sb-foot{display:none}
    .login-cards{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div id="root"></div>

<script>
/* ---------- 基础配置 ---------- */
const KEY='sysclass_db_v10', SKEY='sysclass_session_v10';
const TRAVEL_DATE='2026-08-16';
const TRAVEL_NODES=[
  {slot:'station',label:'前往车站',icon:'🚉',hint:'出发前往集合车站'},
  {slot:'bus',label:'乘坐大巴',icon:'🚌',hint:'登车前往系统班会场'},
  {slot:'venue',label:'抵达系统班会场',icon:'🏫',hint:'到达集训会场签到'},
  {slot:'checkin',label:'完成入住',icon:'🏨',hint:'办理入住安顿完毕'}
];
const DAILY_SLOTS=[
  {slot:'morning',label:'早',icon:'🌅',hint:'晨间行程打卡'},
  {slot:'noon',label:'中',icon:'☀️',hint:'午间行程打卡'},
  {slot:'evening',label:'晚',icon:'🌙',hint:'晚间行程打卡'}
];
const POSITIONS=['首席执行官','首席财务官','首席人事官','特聘战略顾问','英语督学官','体能活力官','阅读推广大使','生活服务官','氛围创意官'];
const TEAMS=[
  {name:'莹领先锋队',call:'勇当先锋，势必争先；May 姐领航，勇夺桂冠'},
  {name:'莹定乾坤队',call:'莹定乾坤，全员聚力；一鼓作气，冠军必取'}
];
const ADMINS=[
  {id:'coach',pwd:'sys2026',type:'coach',name:'主教练（枷莹）'},
  {id:'ta1',  pwd:'ta001', type:'ta',   name:'助教·秀红',team:'莹领先锋队',position:'特聘战略顾问'},
  {id:'ta2',  pwd:'ta002', type:'ta',   name:'助教·文宇',team:'莹定乾坤队',position:'特聘战略顾问'},
  {id:'ta3',  pwd:'ta003', type:'ta',   name:'助教·鸿芬',team:'莹领先锋队',position:'特聘战略顾问'}
];

/* 自动同步：每6秒拉取服务端最新数据并刷新（多设备共享） */
let pausePolling=false; // 关键写操作（建号/删除）期间暂停轮询，避免覆盖刚提交的数据
function isUserEditing(){ // 用户正在输入框打字时，不重建界面，避免打断输入
  const a=document.activeElement;
  if(!a||!a.tagName)return false;
  const t=a.tagName;
  return t==='INPUT'||t==='TEXTAREA'||t==='SELECT';
}
setInterval(()=>{
  if(pausePolling)return;            // 提交中，先不拉不刷
  if(isUserEditing())return;         // 正在打字，不重建 DOM（不再清空输入框）
  loadDB().then(()=>{if(SESSION.role)render()}).catch(()=>{});
},6000);

/* ---------- 复盘评分（移植自参考代码 rate_gangwei_fupan） ---------- */
function rateReview(text,position){
  text=text||'';
  let score=0;
  const kws=DEEP_KW[position]||[];
  const hits=kws.filter(kw=>text.includes(kw)).length;
  score+=Math.min(hits*6,30);
  const actionCount=(text.match(/①/g)||[]).length+(text.match(/1\./g)||[]).length+(text.match(/一、/g)||[]).length;
  score+=Math.min(actionCount*5,20);
  let guo=0;
  if(text.includes('因为')||text.includes('导致')||text.includes('变化'))guo+=15;
  if(text.includes('反馈')||text.includes('说'))guo+=5;
  score+=guo;
  if(text.includes('知道')&&(text.includes('没做到')||text.includes('没做')||text.includes('但'))){
    score+=25;
    if(text.includes('因为')){const p=text.split('因为');if(p[1]&&p[1].length>10)score+=5;}
  }else if(text.includes('没有gap')||text.includes('都做到了')){
    score+=5;
  }else{
    score+=10;
  }
  score=Math.min(score,100);
  const grade=score>=80?'🌟 知行合一·标杆':score>=60?'✅ 知行合一·合格':'⚠️ 知行合一·待提升';
  return {score,grade};
}

function fmtTime(ts){if(!ts)return'';const d=new Date(ts);const p=n=>(''+n).padStart(2,'0');

function streakDays(id,dateStr){let c=0;let d=new Date(dateStr);let guard=0;
  while(guard++<400){const ds=fmtDate(d);if(DAILY_SLOTS.every(sl=>isDone(ck(id,ds,'daily',sl.slot)))){c++;d.setDate(d.getDate()-1);}else break;}
  return c;}

/* ---------- 人才评估：徳才岗 + 知行果合一 ---------- */
function talentScores(s){
  const repNodes=TRAVEL_NODES.filter(n=>isDone(ck(s.id,TRAVEL_DATE,'travel',n.slot))).length;
  const repRate=repNodes/TRAVEL_NODES.length;
  const dailyKeys=Object.keys(DB.checkins).filter(k=>k.startsWith(s.id+'|')&&k.split('|')[2]==='daily');
  let de=repRate*0.5;
  if(dailyKeys.length){
    const dates=new Set(dailyKeys.map(k=>k.split('|')[1]));
    de+=(dailyKeys.length/(dates.size*DAILY_SLOTS.length))*0.5;
  }
  const de_score=Math.round(de*100);
  const dailyList=DB.daily.filter(p=>p.studentId===s.id);
  const dailyScore=dailyList.length?Math.min(50,dailyList.length*12.5):0;
  const avgDaily=dailyList.length?dailyList.reduce((a,r)=>a+r.score,0)/dailyList.length:0;
  const dailyQuality=dailyList.length?Math.min(50,avgDaily*0.5):0;
  const cai_score=Math.round(dailyScore+dailyQuality);
  let gang_score=0;
  if(s.position){
    const dutyList=DB.duty.filter(r=>r.studentId===s.id);
    if(dutyList.length){
      gang_score=Math.round(dutyList.reduce((a,r)=>{
        const kws=DEEP_KW[s.position]||[];const hits=kws.filter(kw=>r.content.includes(kw)).length;
        return a+Math.min(hits*6,30);
      },0)/dutyList.length/30*100);
    }
  }
  const zhixing_score=dailyList.length?Math.round(avgDaily):0;
  const decai=Math.round((de_score+cai_score+gang_score)/3);
  const composite=Math.round(decai*0.5+zhixing_score*0.5);
  const hiD=decai>=60, hiZ=zhixing_score>=60;
  let type;
  if(hiD&&hiZ)type='🌟 标杆型';
  else if(hiD&&!hiZ)type='🚀 潜力型（执行强·反思浅）';
  else if(!hiD&&hiZ)type='🔥 慧眼型（悟性高·执行弱）';
  else type='🌱 待激活型';
  return {de_score,cai_score,gang_score,zhixing_score,decai,composite,type};
}

function autoPlanDate(){const today=fmtDate(new Date());if(PLAN_DATA[today])return today;const all=planDates();return all[0];}
function getDayTasks(date){
  if(!DB.tasks)DB.tasks={};
  if(!DB.tasks[date]){
    const p=PLAN_DATA[date]||{coach:[],ta:[]};
    const arr=[];
    p.coach.forEach((t,i)=>arr.push({id:date+'_c'+i,text:t,doneBy:{},owner:'coach'}));
    p.ta.forEach((t,i)=>arr.push({id:date+'_t'+i,text:t,doneBy:{},owner:'ta'}));
    DB.tasks[date]=arr;saveDB();
  }
  return DB.tasks[date];
}
function taskOwnerKey(){return SESSION.adminType==='ta'?SESSION.adminId:'coach';}
async function toggleTask(id){const d=S.planDate||autoPlanDate();const t=getDayTasks(d).find(x=>x.id===id);if(t){const k=taskOwnerKey();t.doneBy=t.doneBy||{};t.doneBy[k]=!t.doneBy[k];const ok=await saveDB();if(!ok){t.doneBy[k]=!t.doneBy[k];}render();}}
function saveTaskText(id,text){const d=S.planDate||autoPlanDate();const t=getDayTasks(d).find(x=>x.id===id);if(t){t.text=(text||'').trim();saveDB();}}

/* ---------- 导出 CSV（带时间戳） ---------- */
function exportCSV(){
  const rows=[['ID','姓名','小队','职务','报到节点','早','中','晚','PK数','胜','负','平','日精进数','岗位反馈数','日精进均分','综合分','类型','是否苗子']];
  DB.students.forEach(s=>{
    const rep=TRAVEL_NODES.filter(n=>isDone(ck(s.id,TRAVEL_DATE,'travel',n.slot))).length;
    const m=isDone(ck(s.id,S.coachDate,'daily','morning'))?'✓':'';
    const n=isDone(ck(s.id,S.coachDate,'daily','noon'))?'✓':'';
    const e=isDone(ck(s.id,S.coachDate,'daily','evening'))?'✓':'';
    const pk=DB.pk.filter(p=>p.studentId===s.id);
    const win=pk.filter(p=>p.result==='win').length, lose=pk.filter(p=>p.result==='lose').length, draw=pk.filter(p=>p.result==='draw').length;
    const dl=DB.daily.filter(r=>r.studentId===s.id);
    const du=DB.duty.filter(r=>r.studentId===s.id);
    const sc=talentScores(s);
    rows.push([s.id,s.name,s.team,s.position||'',rep,m,n,e,pk.length,win,lose,draw,dl.length,du.length,dl.length?Math.round(dl.reduce((a,r)=>a+r.score,0)/dl.length):0,sc.composite,sc.type,s.picked?'是':'']);
  });
  const csv='\ufeff'+rows.map(r=>r.map(c=>'"'+(c==null?'':c)+'"').join(',')).join('\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  const d=new Date();const p=n=>(''+n).padStart(2,'0');
  a.download='系统班人才数据_'+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'_'+p(d.getHours())+p(d.getMinutes())+p(d.getSeconds())+'.csv';
  a.click();
}

function stuTaskProgress(me){
  let done=0;
  if(TRAVEL_NODES.every(n=>isDone(ck(me.id,TRAVEL_DATE,'travel',n.slot))))done++;
  DAILY_SLOTS.forEach(sl=>{if(isDone(ck(me.id,S.dailyDate,'daily',sl.slot)))done++;});
  if(DB.daily.some(r=>r.studentId===me.id&&r.date===S.dailyDate))done++;
  if(DB.duty.some(r=>r.studentId===me.id&&r.date===S.dailyDate))done++;
  return {done,total:6};
}
function stuBanner(me,isTa){
  const dayNum=dayNumber(S.dailyDate);
  const task=stuTaskProgress(me);
  const streak=streakDays(me.id,S.dailyDate);
  const online=task.done>=5;
  return `<div class="stu-banner">

/* 学员专区 → 每日PK榜（个人/团队双榜，按PK结果排名） */
function studentLeaderboard(){
  const tab=S.lbTab||'personal';
  const dateFilter=S.lbDate||'all';
  const dateRow=`<div class="date-row" style="margin-bottom:12px">
    <input type="date" value="${dateFilter==='all'?'':dateFilter}" onchange="S.lbDate=this.value||'all';render()" style="width:auto"/>
    <button class="btn sm ghost" onclick="S.lbDate='all';render()">全部(累计)</button>
    <span class="pill">统计日</span>
  </div>`;
  const tabRow=`<div class="filter-row">
    <button class="btn sm ${tab==='personal'?'ghost':''}" onclick="S.lbTab='personal';render()">👤 个人榜</button>
    <button class="btn sm ${tab==='team'?'ghost':''}" onclick="S.lbTab='team';render()">🏅 团队榜</button>
  </div>`;
  let body='';
  if(tab==='personal'){
    const rows=DB.students.map(s=>{
      let list=DB.pk.filter(p=>p.studentId===s.id);
      if(dateFilter!=='all')list=list.filter(p=>p.date===dateFilter);
      const win=list.filter(p=>p.result==='win').length;
      const lose=list.filter(p=>p.result==='lose').length;
      const draw=list.filter(p=>p.result==='draw').length;
      return {s,win,lose,draw,total:list.length};
    }).filter(x=>x.total>0).sort((a,b)=> b.win-a.win || b.total-a.total || a.lose-b.lose);
    body=rows.length?rows.map((r,i)=>{
      const medal=i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1);
      const top=i<3?' top'+(i+1):'';
      return `<div class="rank-row${top}">
        <div class="rank-medal">${medal}</div>
        <div class="nm">${r.s.name}${r.s.id===SESSION.studentId?' <span class="pill">我</span>':''}<small>${r.s.team}${r.s.position?' · '+r.s.position:''}</small></div>
        <div class="rank-score">${r.win} 胜<small>负${r.lose} · 平${r.draw} · 共${r.total}</small></div>
      </div>`;
    }).join(''):'<div class="empty">还没有PK数据，去「🌙 每日PK」提交第一条吧～</div>';
  }else{
    const rows=TEAMS.map(t=>{
      const members=new Set(DB.students.filter(s=>s.team===t.name).map(s=>s.id));
      let list=DB.pk.filter(p=>p.type==='team'&&members.has(p.studentId));
      if(dateFilter!=='all')list=list.filter(p=>p.date===dateFilter);
      const win=list.filter(p=>p.result==='win').length;
      const lose=list.filter(p=>p.result==='lose').length;
      const draw=list.filter(p=>p.result==='draw').length;
      return {t,win,lose,draw,total:list.length};
    }).sort((a,b)=> b.win-a.win || b.total-a.total || a.lose-b.lose);
    body=rows.map((r,i)=>{
      const medal=i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1);
      const top=i<3?' top'+(i+1):'';
      return `<div class="rank-row${top}">
        <div class="rank-medal">${medal}</div>
        <div class="nm">${r.t.name}<small>队呼：${teamCall(r.t.name)}</small></div>
        <div class="rank-score">${r.win} 胜<small>负${r.lose} · 平${r.draw} · 共${r.total}</small></div>
      </div>`;
    }).join('');
  }
  return `
    <div class="card">
      <h2>🏆 每日PK榜</h2>
      <p class="desc">按 PK 的<b>胜负结果</b>实时排名——个人榜看谁最猛，团队榜看哪队最强。胜场多者靠前，平局比提交数。</p>
      ${tabRow}
      ${dateRow}
      ${body}
    </div>`;
}

async function savePos(id){
  const inp=document.getElementById('posedit');
  const s=DB.students.find(x=>x.id===id);
  if(!s)return;
  const v=inp?inp.value.trim():'';
  s.position=v||'成员';

    const ok=await saveDB();
    if(!ok){alert('保存失败，请重试');await loadDB();render();return;}
    S.editPosId=null;render();
  }finally{pausePolling=false;}

      <p class="desc">助教提交的人才情况反馈会汇集在这里，供教练掌握各学员培养动态。</p>
      ${list}
    </div>`;
}
function submitTalentFromUI(){
  const v=document.getElementById('talentContent').value.trim();
  if(!v){alert('先写点什么再提交吧～');return;}
  addTalent(SESSION.adminId,SESSION.adminName,v);
}
/* 人才评级 · 选苗子（人才画像卡片） */
function adminScout(){
  const filter=`<div class="filter-row">
    <span class="pill">小队</span>
    <button class="btn sm ${S.scoutTeam==='all'?'ghost':''}" onclick="S.scoutTeam='all';render()">全部</button>
    ${teams().map(t=>`<button class="btn sm ${S.scoutTeam===t?'ghost':''}" onclick="S.scoutTeam='${t}';render()">${t}</button>`).join('')}
  </div>
  <div class="filter-row">
    <span class="pill">类型</span>
    <button class="btn sm ${S.scoutType==='all'?'ghost':''}" onclick="S.scoutType='all';render()">全部</button>
    ${['标杆','潜力','慧眼','待激活'].map(ty=>`<button class="btn sm ${S.scoutType===ty?'ghost':''}" onclick="S.scoutType='${ty}';render()">${ty}型</button>`).join('')}
  </div>
  <div class="date-row" style="margin-bottom:10px">
    <span class="pill">最低综合分</span>
    <input type="number" id="scoutMin" value="${S.scoutMin}" min="0" max="100" style="width:90px" onchange="S.scoutMin=parseInt(this.value||'0',10);render()" />
  </div>`;
  let rows=studentsInTeam(S.scoutTeam).filter(s=>!s.isTa).map(s=>({s,sc:talentScores(s)}));
  if(S.scoutType!=='all')rows=rows.filter(r=>r.sc.type.includes(S.scoutType));
  rows=rows.filter(r=>r.sc.composite>=S.scoutMin);
  rows.sort((a,b)=>b.sc.composite-a.sc.composite);
  const cards=rows.length?`<div class="talent-grid">`+rows.map(({s,sc})=>`
    <div class="talent-card">
      <div class="tc-head">
        <div class="tc-avatar">${animalFor(s.id)}</div>
        <div class="tc-info">
          <div class="tc-name">${s.name} ${s.picked?'<span class="pill">⭐苗子</span>':''}</div>
          <div class="tc-role">${s.team} · ${s.position||'成员'}</div>
        </div>
        <div class="tc-type ${sc.composite>=80?'t-top':(sc.composite>=60?'t-mid':'t-low')}">${sc.type}</div>
      </div>
      <div class="tc-tags">
        <span class="tc-tag">德 ${sc.de_score}</span>
        <span class="tc-tag">才 ${sc.cai_score}</span>
        <span class="tc-tag">岗 ${sc.gang_score}</span>
        <span class="tc-tag">知行 ${sc.zhixing_score}</span>
        <span class="tc-tag hi">综合 ${sc.composite}</span>
      </div>
      <div class="tc-foot">
        <label class="pick-chk"><input type="checkbox" ${s.picked?'checked':''} onchange="togglePick('${s.id}',this.checked)"/> 选为苗子</label>
        <input type="text" id="picknote_${s.id}" value="${esc(s.pickNote||'')}" placeholder="培养方向备注" style="flex:1;min-width:80px" onchange="savePickNote('${s.id}')"/>
      </div>
    </div>`).join('')+`</div>`
    :'<div class="empty">没有符合条件的学生，调整筛选条件试试。</div>';
  return `
    <div class="card">
      <h2>🔍 人才评级 · 选苗子</h2>
      <p class="desc">系统按 <b>徳(打卡纪律)·才(日精进数量质量)·岗(职务胜任度)</b> 与 <b>知行果合一(日精进评分)</b> 自动算综合人才分并标注类型；教练可设阈值筛选、按分排序，勾选心仪苗子并备注。综合分 = 徳才岗×0.5 + 知行果×0.5。</p>
      ${filter}
      ${cards}
    </div>`;
}
function togglePick(id,val){const s=DB.students.find(x=>x.id===id);if(s){s.picked=val;saveDB();render();}}
function savePickNote(id){const s=DB.students.find(x=>x.id===id);const v=document.getElementById('picknote_'+id).value.trim();if(s){s.pickNote=v;saveDB();}}
/* 学员提交查看：日精进(有评分) + 岗位反馈 */
function adminSubmit(view){
  const toggle=`<div class="filter-row">
    <button class="btn sm ${view==='daily'?'ghost':''}" onclick="switchAdminTab('submit_daily')">📖 日精进（含评分）</button>
    <button class="btn sm ${view==='duty'?'ghost':''}" onclick="switchAdminTab('submit_duty')">💼 岗位复盘</button>
  </div>`;
  if(view==='daily'){
    let list=DB.daily.slice();
    if(S.coachTeam!=='all'){const set=new Set(studentsInTeam(S.coachTeam).map(s=>s.id));list=list.filter(r=>set.has(r.studentId));}
    const cards=list.length?list.map(r=>{
      const st=DB.students.find(s=>s.id===r.studentId);
      return `<div class="pk-review"><div class="hd">
        <div><b>${st?st.name:'(未知)'}</b> <small style="color:var(--sub)">${st?st.team:''}${st&&st.position?' · '+st.position:''} · ${r.date} ${fmtTime(r.ts)}</small></div>
        <span class="badge done">${r.score}分</span></div>
        <div class="ct" style="font-size:14px;white-space:pre-wrap;word-break:break-word">${esc(r.content)}</div>
        <div class="fb-box" style="margin-top:8px"><div class="fl">📊 ${r.grade}</div></div></div>`;
    }).join(''):'<div class="empty">还没有学生提交日精进。</div>';
    return `
      <div class="card">
        <h2>📖 学员提交 · 日精进</h2>
        <p class="desc">所有学生在「日精进与岗位反馈 · 提交日精进」写的系统班学习成长复盘（含知行合一评分）汇集于此。可按小队筛选。</p>
        ${teamFilterRow()}${toggle}${cards}
      </div>`;
  }else{
    let list=DB.duty.slice();
    if(S.coachTeam!=='all'){const set=new Set(studentsInTeam(S.coachTeam).map(s=>s.id));list=list.filter(r=>set.has(r.studentId));}
    const cards=list.length?list.map(r=>{
      const st=DB.students.find(s=>s.id===r.studentId);
      return `<div class="pk-review"><div class="hd">
        <div><b>${st?st.name:'(未知)'}</b> <small style="color:var(--sub)">${st?st.team:''}${st&&st.position?' · '+st.position:''} · ${r.date} ${fmtTime(r.ts)}</small></div>
        <span class="badge team">履职</span></div>
        <div class="ct" style="font-size:14px;white-space:pre-wrap;word-break:break-word">${esc(r.content)}</div></div>`;
    }).join(''):'<div class="empty">还没有学生提交岗位反馈。</div>';
    return `
      <div class="card">
        <h2>💼 学员提交 · 岗位复盘</h2>
        <p class="desc">所有学生在「日精进与岗位反馈 · 岗位反馈」写的履职记录汇集于此。可按小队筛选。</p>
        ${teamFilterRow()}${toggle}${cards}
      </div>`;
  }
}
async function addStudentFromUI(){
  pausePolling=true; // 提交期间暂停轮询，防止服务器旧数据覆盖刚建的号
  try{
    const id=document.getElementById('nid').value.trim().toUpperCase();
    const name=document.getElementById('nname').value.trim();
    const team=document.getElementById('nteam').value.trim();
    const position=document.getElementById('nposition').value;
    if(!id||!name||!team){alert('学生ID、姓名、小队都为必填');return;}
    if(DB.students.some(s=>s.id===id)){alert('该学生ID已存在，请换一个');return;}
    DB.students.push({id,name,team,position:position||'成员',picked:false,pickNote:''});
    const ok=await saveDB();
    if(!ok){alert('网络不稳定，保存失败，请重试');DB.students=DB.students.filter(s=>s.id!==id);render();return;}
    alert('账号创建成功：'+id+' '+name);
    render();
  } finally{ pausePolling=false; }
}
let pendingDelete=null;
function askDelete(id){pendingDelete=id;render();}
function cancelDelete(){pendingDelete=null;render();}
async function deleteStudent(id){
  pausePolling=true; // 删除期间暂停轮询，防止旧数据覆盖删除结果
  try{
    pendingDelete=null;
    const snap={students:DB.students.slice(),checkins:Object.assign({},DB.checkins),pk:DB.pk.slice(),daily:DB.daily.slice(),duty:DB.duty.slice()};
    DB.students=DB.students.filter(s=>s.id!==id);
    Object.keys(DB.checkins).forEach(k=>{if(k.startsWith(id+'|'))delete DB.checkins[k];});
    DB.pk=DB.pk.filter(p=>p.studentId!==id);
    DB.daily=DB.daily.filter(r=>r.studentId!==id);
    DB.duty=DB.duty.filter(r=>r.studentId!==id);
    if(SESSION.role==='student'&&SESSION.studentId===id){logout();return;}
    const ok=await saveDB();
    if(!ok){alert('网络不稳定，删除失败，已恢复');Object.assign(DB,snap);render();return;}
    render();
  } finally{ pausePolling=false; }
}

/* ---------- 启动 ---------- */
loadDB().then(()=>ensureStruct()).then(()=>{loadSession();render();});
</script>
